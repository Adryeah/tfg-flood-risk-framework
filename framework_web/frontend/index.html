<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flood Risk Framework</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Type pairing · Flood Risk × Zurich Design System:
      · Inter          → body + all UI chrome (corporate enterprise sans,
                         optimized for screen rendering at small sizes)
      · JetBrains Mono → tabular numbers, KPIs, ECharts axes, code
      · IBM Plex Serif → editorial serif for hero anchors, methodology
                         titles, pull-quotes. Institutional register
                         that distinguishes academic content from ops
                         dashboard chrome.
    -->
    <!-- Inter as VARIABLE axis (300..700) so font-weight:510 resolves
         exactly per the Linear×Basedash spec. JetBrains Mono for all
         technical IDs/values. IBM Plex Serif kept for editorial registers. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="dark bg-bg-base text-text-primary font-sans antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
